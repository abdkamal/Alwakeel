# The .NET agents build on the same four core machine, so the Android build stays small.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# The Android Gradle Plugin runs on JDK 17; the machine's default java is newer, which
# neither Gradle 8.13 nor AGP 8.13 accepts, so the daemon JVM is named here.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false

kotlin.code.style=official

# Roborazzi renders the screenshots through the real Android graphics stack under Robolectric.
robolectric.graphicsMode=NATIVE
